name: Develop Release (Fork)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Android SDK setup
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Run tests and verify coverage
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:checkCoverageBaseline

      - name: Compute dev release version
        run: |
          git fetch --tags origin
          prev_tag=$(git tag -l "v*" --sort=-v:refname | grep -v -- "-dev\." | head -n 1 || true)
          prev_tag=${prev_tag:-v0.0.0}
          echo "prev_tag=${prev_tag}" >> "$GITHUB_ENV"

          version=${prev_tag#v}
          version=${version%%-*}
          version=${version%%+*}

          IFS='.' read -r major minor patch <<< "$version" || true
          major=$(echo "${major:-0}" | grep -oE '^[0-9]+' || echo "0")
          minor=$(echo "${minor:-0}" | grep -oE '^[0-9]+' || echo "0")
          patch=$(echo "${patch:-0}" | grep -oE '^[0-9]+' || echo "0")

          major=$((10#$major))
          minor=$((10#$minor))
          patch=$((10#$patch))

          if [ "$prev_tag" = "v0.0.0" ]; then
            log_range="HEAD"
          else
            log_range="${prev_tag}..HEAD"
          fi

          subjects=$(git log "$log_range" --pretty=%s)
          bodies=$(git log "$log_range" --pretty=%b)

          if echo "$subjects" | grep -qE '^(feat|fix|refactor)(\(.*\))?!:|\[BREAKING\]' || echo "$bodies" | grep -qE '^BREAKING[- ]CHANGE:'; then
            major=$((major + 1))
            minor=0
            patch=0
          elif echo "$subjects" | grep -qE '^(feat|refactor)(\(.*\))?:'; then
            minor=$((minor + 1))
            patch=0
          elif echo "$subjects" | grep -qE '^fix(\(.*\))?:'; then
            patch=$((patch + 1))
          fi

          new_tag="v${major}.${minor}.${patch}-dev.${GITHUB_RUN_NUMBER}"
          echo "new_tag=${new_tag}" >> "$GITHUB_ENV"
          echo "Previous upstream tag: ${prev_tag}"
          echo "New dev version: ${new_tag}"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.keystore
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.keystore/upload-keystore.jks

      - name: Build productive release APK
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PversionName=${{ env.new_tag }} -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/karoo-forumslader-${{ env.new_tag }}.apk"

      - name: Generate Release Notes
        run: kotlinc -script .github/scripts/generate_release_notes.kts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.new_tag }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ env.new_tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/karoo-forumslader-${{ env.new_tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

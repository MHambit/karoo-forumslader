name: Develop Release (Fork)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Android SDK setup
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Run unit tests
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:testDebugUnitTest

      - name: Compute develop prerelease tag
        run: |
          base_tag=$(git tag -l "v*" --sort=-v:refname | grep -v -- "-dev\." | head -n 1 || true)
          base_tag=${base_tag:-v0.0.0}
          dev_tag="${base_tag}-dev.${GITHUB_RUN_NUMBER}"
          echo "dev_tag=${dev_tag}" >> "$GITHUB_ENV"
          echo "Release tag: ${dev_tag}"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.keystore
          echo "$KEYSTORE_BASE64" | base64 -d > ~/.keystore/upload-keystore.jks

      - name: Build release APK
        env:
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PversionName=${{ env.dev_tag }} -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/karoo-forumslader-${{ env.dev_tag }}.apk"

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.dev_tag }}
          target_commitish: ${{ github.sha }}
          name: Develop ${{ env.dev_tag }}
          generate_release_notes: true
          draft: false
          prerelease: true
          files: app/build/outputs/apk/release/karoo-forumslader-${{ env.dev_tag }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
